<!DOCTYPE html>
<html>
<head>
    <title>MicTab Speech Bridge</title>
</head>
<body>
    <script>
        'use strict';

        // --- State ---
        let ws = null;
        let recognition = null;
        let currentLang = 'en-US';
        let isActive = false;        // Are we supposed to be listening?
        let currentSessionId = 0;    // Tracks the current listening session
        let isRestarting = false;    // Prevent double-starts during restart
        let restartTimer = null;     // Stored so stopListening() can cancel it
        let silenceTimer = null;
        let SILENCE_TIMEOUT_MS = 15000;
        let selectedDeviceId = null; // null = use Chrome default (system default mic)
        let watchdogTimer = null;    // Detects frozen recognition (isActive=true but dead)
        let lastResultTime = 0;      // When onresult last fired — used by dead detector
        let deadDetectorTimer = null; // Detects recognition alive but not producing results
        let proactiveRestartTimer = null; // Restarts recognition proactively before ~60s timeout for non-English languages
        let restartCount = 0;        // Consecutive onend restarts without receiving results
        let proactiveRestartPending = false; // Set true just before proactive recognition.stop() so onend knows
        const MAX_RESTART_COUNT = 5;  // Stop after this many consecutive restarts without results
        
        // --- Web Audio API for Visualizer ---
        let audioCtx = null;
        let analyser = null;
        let gainNode = null;
        let analyserInterval = null;
        let micSensitivity = 1.0;

        // --- WebSocket ---
        function setupWebSocket() {
            const port = new URLSearchParams(window.location.search).get('port') || 9123;
            ws = new WebSocket(`ws://localhost:${port}`);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'status', message: 'ready' }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.command === 'start') {
                    if (data.timeout !== undefined) {
                        SILENCE_TIMEOUT_MS = parseInt(data.timeout, 10) * 1000;
                    }
                    startListening(data.language || 'en-US');
                } else if (data.command === 'stop') {
                    stopListening();
                } else if (data.command === 'ping') {
                    if (isActive) armSilenceTimer();
                } else if (data.command === 'set-timeout') {
                    // Live update of silence timeout without stop/start
                    const newMs = parseInt(data.timeout || 0, 10) * 1000;
                    SILENCE_TIMEOUT_MS = newMs;
                    if (isActive) armSilenceTimer(); // Re-arm with new value
                } else if (data.command === 'get-devices') {
                    // Enumerate audio input devices and send list back
                    enumerateDevices();
                } else if (data.command === 'set-device') {
                    // User picked a mic — store it, mic routing applies on next start
                    selectedDeviceId = data.deviceId || null;
                } else if (data.command === 'set-mic-sensitivity') {
                    micSensitivity = data.sensitivity || 1.0;
                    if (gainNode) {
                        gainNode.gain.value = micSensitivity;
                    }
                }
            };

            ws.onclose = () => {
                setTimeout(setupWebSocket, 500);
            };
        }

        // --- Silence timer ---
        function armSilenceTimer() {
            clearSilenceTimer();
            if (SILENCE_TIMEOUT_MS <= 0) return; // 0 means infinity/never

            silenceTimer = setTimeout(() => {
                // Configured seconds of silence — stop completely
                ws.send(JSON.stringify({ type: 'status', message: 'silence-timeout' }));
                stopListening();
            }, SILENCE_TIMEOUT_MS);
        }

        function clearSilenceTimer() {
            if (silenceTimer) {
                clearTimeout(silenceTimer);
                silenceTimer = null;
            }
        }

        // --- Device enumeration --------------------------------------------------
        // Works on both macOS and Windows — Chrome has already obtained mic
        // permission by the time this page loads, so device labels are populated.
        function enumerateDevices() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                ws.send(JSON.stringify({ type: 'device-list', devices: [] }));
                return;
            }
            navigator.mediaDevices.enumerateDevices().then(devices => {
                const audioInputs = devices
                    .filter(d => d.kind === 'audioinput')
                    .map(d => ({ id: d.deviceId, label: d.label || `Microphone (${d.deviceId.slice(0,8)})` }));
                ws.send(JSON.stringify({ type: 'device-list', devices: audioInputs }));
            }).catch(() => {
                ws.send(JSON.stringify({ type: 'device-list', devices: [] }));
            });
        }

        // --- Recognition ---
        function createRecognition() {
            const SpeechRecognitionCtor = window.webkitSpeechRecognition || window.SpeechRecognition;
            if (!SpeechRecognitionCtor) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'status', message: 'speech-api-unavailable' }));
                }
                return null;
            }
            const r = new SpeechRecognitionCtor();
            r.continuous = true;
            r.interimResults = true; // Send interim for live typing effect in overlay
            r.lang = currentLang;
            r.maxAlternatives = 1;

            r.onresult = (event) => {
                let finalTranscript   = '';
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                // Only reset clocks if we actually heard words/text (prevents background noise empty results from keeping it alive indefinitely)
                if (interimTranscript.trim() || finalTranscript.trim()) {
                    lastResultTime = Date.now();
                    restartCount = 0;
                    armSilenceTimer();
                }

                // Always broadcast interim for live waveform/typing effect
                ws.send(JSON.stringify({ type: 'interim-text', text: interimTranscript }));

                if (finalTranscript.trim()) {
                    ws.send(JSON.stringify({ type: 'final-text', text: finalTranscript.trim() }));
                }
            };

            r.onerror = (event) => {
                // 'no-speech' just means silence — not an error, keep counting towards 15s timeout
                if (event.error === 'no-speech') return;
                // All other errors, let onend handle the restart
            };

            r.onend = () => {
                if (!isActive || isRestarting) return;

                // Chrome stopped on its own (timeout, network blip, etc.)
                // We want to be active — hard-restart with fresh mic stream.
                // ── FIX: Non-English languages (Bengali, etc.) die after ~60s ──
                // Chrome's server-side streaming session expires more aggressively
                // for non-English languages. A lightweight restart (just creating a
                // new SpeechRecognition) silently fails to reconnect. Releasing the
                // mic stream and re-acquiring it forces a fresh server connection.
                restartCount++;
                isRestarting = true;
                const restartSessionId = currentSessionId;

                // ── Safety valve: stop after too many consecutive restarts ──
                // Prevents infinite restart loops when system audio is unavailable
                // (e.g. sleep/wake, coreaudiod crash).
                if (restartCount > MAX_RESTART_COUNT) {
                    console.warn('[MicTab] Max restart count exceeded — stopping.');
                    isRestarting = false;
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'status', message: 'max-restarts-exceeded' }));
                    }
                    stopListening();
                    return;
                }

                // Exponential backoff for error-driven restarts; flat 200ms for proactive (scheduled) restarts.
                // Proactive restarts happen while speech IS flowing, so a long delay = lost words.
                const delay = proactiveRestartPending ? 200 : Math.min(400 * Math.pow(2, restartCount - 1), 5000);
                proactiveRestartPending = false; // consume the flag

                restartTimer = setTimeout(() => {
                    restartTimer = null;
                    // ── BUGFIX (PTT no-speech stuck mic) ──
                    // If the session ID changed, stopListening() was called while
                    // we were waiting. Do NOT restart — release and bail out.
                    if (!isActive || restartSessionId !== currentSessionId) {
                        isRestarting = false;
                        if (activeStream) {
                            activeStream.getTracks().forEach(t => t.stop());
                            activeStream = null;
                        }
                        return;
                    }

                    // Hard restart: release mic stream for a full reset
                    if (activeStream) {
                        activeStream.getTracks().forEach(t => t.stop());
                        activeStream = null;
                    }

                    // Re-acquire mic and create fresh recognition
                    startListeningWithRouting(currentLang, restartSessionId, () => {
                        if (!isActive || restartSessionId !== currentSessionId) {
                            isRestarting = false;
                            return;
                        }
                        try {
                            recognition = createRecognition();
                            recognition.start();
                            // Do NOT call armSilenceTimer() here. Let the existing timer continue to track
                            // total contiguous silence, otherwise Chrome's internal timeouts will keep resetting our 15s!
                        } catch (e) {
                            console.error('[MicTab] Hard restart failed:', e);
                            // Clean up the mic stream we just acquired to prevent stuck mic
                            if (activeStream) {
                                activeStream.getTracks().forEach(t => t.stop());
                                activeStream = null;
                            }
                            if (ws && ws.readyState === WebSocket.OPEN) {
                                ws.send(JSON.stringify({ type: 'status', message: 'start-failed' }));
                            }
                            isRestarting = false;
                            stopListening();
                            return;
                        }
                        isRestarting = false;
                    });
                }, delay);
            };

            return r;
        }

        // --- Mic routing ---------------------------------------------------------
        // When a specific device is selected, we open a getUserMedia stream on that
        // device before starting recognition. Chrome routes the Web Speech API
        // through whichever mic stream is most recently active, so this effectively
        // forces the recognition to use the chosen device.
        // When selectedDeviceId is null, we skip this entirely — default behaviour.
        let activeStream = null; // Keep reference so we can stop tracks on stopListening

        function setupAnalyser(stream) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            try {
                const source = audioCtx.createMediaStreamSource(stream);
                gainNode = audioCtx.createGain();
                gainNode.gain.value = micSensitivity;
                
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64; // results in 32 frequency bins
                
                source.connect(gainNode);
                gainNode.connect(analyser);
                
                if (analyserInterval) clearInterval(analyserInterval);
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                analyserInterval = setInterval(() => {
                    if (!isActive) return;
                    analyser.getByteFrequencyData(dataArray);
                    
                    // Take the first 16 bins (usually covers human vocal range nicely)
                    const bins = Array.from(dataArray.slice(0, 16));
                    
                    // Simple average volume
                    let sum = 0;
                    for (let i = 0; i < bins.length; i++) sum += bins[i];
                    const volume = bins.length ? (sum / bins.length) : 0;
                    
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        // Sending max 30 times a second to keep IPC relatively quiet
                        ws.send(JSON.stringify({ type: 'audio-data', bins, volume }));
                    }
                }, 1000 / 30);
            } catch (e) {
                console.error("Audio analyser failed:", e);
            }
        }

        function startListeningWithRouting(lang, mySessionId, callback) {
            const triedSpecificDevice = !!selectedDeviceId;
            const constraints = selectedDeviceId ? { audio: { deviceId: { exact: selectedDeviceId } } } : { audio: true };
            // Stop any previous routing stream
            if (activeStream) {
                activeStream.getTracks().forEach(t => t.stop());
                activeStream = null;
            }
            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    // ── Race condition guard ──
                    // If stopListening() was called while getUserMedia was resolving
                    // (user did a quick press-and-release), isActive is now false.
                    // Also check if mySessionId matches currentSessionId to prevent
                    // an old getUserMedia promise from overwriting a newer session's stream.
                    if (!isActive || mySessionId !== currentSessionId) {
                        stream.getTracks().forEach(t => t.stop());
                        return; // Don't set activeStream, don't start recognition
                    }
                    activeStream = stream;
                    setupAnalyser(stream);
                    callback();
                })
                .catch((err) => {
                    console.error('[MicTab] getUserMedia failed:', err);
                    // If a specific device was selected, retry once with system default
                    if (triedSpecificDevice) {
                        selectedDeviceId = null;
                        navigator.mediaDevices.getUserMedia({ audio: true })
                            .then(stream => {
                                if (!isActive || mySessionId !== currentSessionId) {
                                    stream.getTracks().forEach(t => t.stop());
                                    return;
                                }
                                activeStream = stream;
                                setupAnalyser(stream);
                                callback();
                            })
                            .catch(() => {
                                // Even default mic failed — system audio unavailable
                                console.error('[MicTab] Default mic also unavailable.');
                                if (ws && ws.readyState === WebSocket.OPEN) {
                                    ws.send(JSON.stringify({ type: 'status', message: 'mic-unavailable' }));
                                }
                                isRestarting = false;
                                stopListening();
                            });
                    } else {
                        // Already on default — system audio is truly unavailable
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'status', message: 'mic-unavailable' }));
                        }
                        isRestarting = false;
                        stopListening();
                    }
                });
        }

        // --- Watchdog ---
        // Runs every 90s while active. Detects the frozen state where isActive=true
        // but recognition has died and isRestarting got permanently stuck or reset
        // without recognition restarting (the key symptom the user reported).
        function armWatchdog() {
            clearWatchdog();
            watchdogTimer = setInterval(() => {
                if (!isActive) { clearWatchdog(); return; }
                // If we're supposed to be active but recognition is null and
                // we're not already in a restart cycle, something went wrong.
                if (!isRestarting && !recognition) {
                    console.warn('[MicTab Watchdog] Recognition appears dead. Force-restarting.');
                    // Send a status ping so the overlay knows we detected the issue
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'status', message: 'watchdog-restart' }));
                    }
                    isRestarting = false;
                    try {
                        recognition = createRecognition();
                        recognition.start();
                    } catch (e) {
                        console.error('[MicTab Watchdog] Force-restart failed:', e);
                    }
                }
            }, 90000); // Check every 90 seconds
        }

        function clearWatchdog() {
            if (watchdogTimer) {
                clearInterval(watchdogTimer);
                watchdogTimer = null;
            }
        }

        // --- Dead-recognition detector ---
        // Catches the case where recognition.start() succeeded but the server
        // silently stopped sending results (alive but deaf). This is more
        // targeted than the watchdog: it checks every 10s and triggers after
        // 25s of no onresult events. When detected, it stops recognition to
        // trigger onend, which performs a hard restart with fresh mic stream.
        function armDeadDetector() {
            clearDeadDetector();
            deadDetectorTimer = setInterval(() => {
                if (!isActive) { clearDeadDetector(); return; }
                if (!recognition || isRestarting) return;

                const elapsed = Date.now() - lastResultTime;
                if (lastResultTime > 0 && elapsed > 25000) {
                    console.warn('[MicTab DeadDetector] No results for 25s — forcing restart.');
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'status', message: 'dead-restart' }));
                    }
                    lastResultTime = Date.now(); // Prevent re-trigger during restart
                    try { recognition.stop(); } catch(e) {} // Triggers onend → hard restart
                }
            }, 10000);
        }

        function clearDeadDetector() {
            if (deadDetectorTimer) {
                clearInterval(deadDetectorTimer);
                deadDetectorTimer = null;
            }
        }

        // --- Proactive Restart ---
        // Chrome's server-side session expires at ~60s for non-English languages.
        // We restart it proactively at 50s to avoid dropping words right when the server hangs up.
        function armProactiveRestart() {
            clearProactiveRestart();
            // Only arm for non-English languages
            if (currentLang && !currentLang.startsWith('en-')) {
                proactiveRestartTimer = setTimeout(() => {
                    if (!isActive || !recognition || isRestarting) return;
                    console.log(`[MicTab] Proactively restarting recognition for non-English language (${currentLang}) at 50s.`);
                    // Reset restartCount — this is a clean scheduled restart, not an error
                    restartCount = 0;
                    proactiveRestartPending = true; // Tell onend to use fast fixed delay
                    try { recognition.stop(); } catch(e) {} // Triggers onend -> hard restart
                }, 50000); // 50 seconds
            }
        }

        function clearProactiveRestart() {
            if (proactiveRestartTimer) {
                clearTimeout(proactiveRestartTimer);
                proactiveRestartTimer = null;
            }
        }

        function startListening(lang) {
            const newLang = lang || currentLang;

            // ── BUGFIX (language-switch / rapid toggle) ──
            // Previously, if isActive was true the start command was silently
            // dropped. This caused language switches (Option+C → Option+B) to
            // leave the mic running in the old language with no recognition.
            // Now: if already active AND the language is different, do a full
            // teardown first, then start fresh with the new language.
            if (isActive) {
                if (newLang === currentLang) return; // Same language, already running — no-op
                // Different language — tear down current session and restart
                stopListening();
            }

            currentLang = newLang;
            currentSessionId++;
            const mySessionId = currentSessionId;
            isActive = true;
            isRestarting = false;
            lastResultTime = Date.now();
            restartCount = 0;
            startListeningWithRouting(currentLang, mySessionId, () => {
                if (!isActive || mySessionId !== currentSessionId) return; // double check
                recognition = createRecognition();
                try {
                    recognition.start();
                } catch (e) {
                    console.error('[MicTab] recognition.start() failed:', e);
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'status', message: 'start-failed' }));
                    }
                    stopListening();
                    return;
                }
                armSilenceTimer();
                armWatchdog();
                armDeadDetector();
                armProactiveRestart();
            });
        }

        function stopListening() {
            isActive = false;
            // Increment session ID so any in-flight getUserMedia promises or
            // pending restart timers from the dying session see a stale ID
            // and abort rather than acquiring/keeping a mic stream.
            currentSessionId++;
            isRestarting = false;
            // BUGFIX: Cancel any pending restart timer so it cannot fire
            // after we've stopped and potentially start recognition again
            // on a session that should be stopped.
            if (restartTimer) {
                clearTimeout(restartTimer);
                restartTimer = null;
            }
            clearSilenceTimer();
            clearWatchdog();
            clearDeadDetector();
            clearProactiveRestart();
            restartCount = 0;
            proactiveRestartPending = false;
            if (analyserInterval) {
                clearInterval(analyserInterval);
                analyserInterval = null;
            }
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
                recognition = null;
            }
            // Release routing stream so the mic indicator light turns off
            if (activeStream) {
                activeStream.getTracks().forEach(t => t.stop());
                activeStream = null;
            }
        }

        // Expose for Puppeteer just in case
        window.startRecognition = startListening;
        window.stopRecognition = stopListening;

        setupWebSocket();
    </script>
</body>
</html>
