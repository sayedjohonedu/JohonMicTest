<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Update Available</title>
  <link rel="stylesheet" href="popup-theme.css">
  <style>
    .progress-text {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.7);
      min-height: 16px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="popup-card">
    <div class="ambient-glow ambient-emerald"></div>
    
    <button class="top-close-btn" id="top-close" title="Close (Esc)" aria-label="Close">
      <span id="close-icon"></span>
    </button>

    <div class="popup-header">
      <div class="icon-ring icon-ring-emerald" id="main-icon"></div>
      <h2 class="popup-title">Update Available</h2>
      <div class="badge-pill badge-emerald">
        <span id="sparkle-icon" style="display:inline-flex;align-items:center;"></span>
        <span id="version-text">v0.0.0</span>
      </div>
    </div>

    <p class="popup-desc">A new version of MicTab is ready. Update now for the latest features, speed improvements, and bug fixes.</p>

    <div class="progress-text" id="progress-text"></div>

    <div class="btn-row" id="btn-row">
      <button class="btn btn-secondary" id="btn-later">Remind later</button>
      <button class="btn btn-primary-emerald" id="btn-update">Update Now <span class="kbd">↵</span></button>
    </div>
  </div>

  <script src="icons.js"></script>
  <script>
    MicTabIcons.inject('#close-icon', 'close', { size: 14 });
    MicTabIcons.inject('#main-icon', 'download', { size: 24 });
    MicTabIcons.inject('#sparkle-icon', 'sparkles', { size: 12, color: '#34d399' });

    const versionBadge = document.getElementById('version-text');
    const progressText = document.getElementById('progress-text');
    const btnUpdate = document.getElementById('btn-update');
    const btnLater = document.getElementById('btn-later');
    const topClose = document.getElementById('top-close');

    // Receive available version
    window.junoAPI.onUpdateReminderInfo((info) => {
      if (info && info.version) {
        versionBadge.textContent = 'v' + info.version;
      }
    });

    // Listen for update status
    window.junoAPI.onUpdateStatus((info) => {
      if (info.type === 'progress') {
        progressText.textContent = 'Downloading: ' + Math.round(info.percent) + '%';
        btnUpdate.innerHTML = 'Downloading…';
        btnUpdate.disabled = true;
        btnUpdate.style.opacity = '0.75';
      } else if (info.type === 'downloaded') {
        progressText.textContent = 'Download complete!';
        btnUpdate.innerHTML = 'Restart & Install <span class="kbd">↵</span>';
        btnUpdate.disabled = false;
        btnUpdate.style.opacity = '1';
        btnUpdate.onclick = () => window.junoAPI.installUpdate();
      } else if (info.type === 'error') {
        progressText.textContent = 'Download failed. Try again later.';
        btnUpdate.innerHTML = 'Update Now <span class="kbd">↵</span>';
        btnUpdate.disabled = false;
        btnUpdate.style.opacity = '1';
      }
    });

    const triggerUpdate = () => {
      if (btnUpdate.disabled) return;
      progressText.textContent = 'Starting download…';
      btnUpdate.innerHTML = 'Downloading…';
      btnUpdate.disabled = true;
      btnUpdate.style.opacity = '0.75';
      window.junoAPI.downloadUpdate();
    };

    const dismissPopup = () => {
      window.junoAPI.dismissUpdateReminder();
    };

    btnUpdate.addEventListener('click', triggerUpdate);
    btnLater.addEventListener('click', dismissPopup);
    topClose.addEventListener('click', dismissPopup);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') dismissPopup();
      if (e.key === 'Enter') triggerUpdate();
    });
  </script>
</body>
</html>
