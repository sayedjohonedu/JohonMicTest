<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MicTab App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1a1a1e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* ── Title bar ─────────────────────────────────────────── */
    #titlebar {
      display: flex;
      align-items: center;
      height: 38px;
      min-height: 38px;
      padding: 0 10px;
      background: #111114;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      -webkit-app-region: drag;
      user-select: none;
      gap: 8px;
      flex-shrink: 0;
    }

    #app-title {
      flex: 1;
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(255,255,255,0.75);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tb-btn {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 26px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .tb-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .tb-btn.pinned { color: #3b82f6; }
    .tb-btn.pinned svg { fill: currentColor; }
    .tb-btn.pinned:hover { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .tb-btn.close-btn:hover { background: rgba(255, 80, 80, 0.25); color: #ff6b6b; }

    /* ── App iframe ─────────────────────────────────────────── */
    #app-frame {
      flex: 1;
      width: 100%;
      border: none;
      display: block;
      min-height: 0;
    }
  </style>
</head>
<body>

  <div id="titlebar">
    <span id="app-title">Loading…</span>

    <!-- Pin (Always on Top) -->
    <button class="tb-btn" id="btn-pin" title="Pin always on top" aria-label="Pin always on top">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="17" x2="12" y2="22"/>
        <path d="M5 17h14v-1.76a2 2 0 0 0-.44-1.24l-2.78-3.48A2 2 0 0 1 15 9.28V5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v4.28a2 2 0 0 1-.78 1.24l-2.78 3.48a2 2 0 0 0-.44 1.24z"/>
      </svg>
    </button>

    <!-- Reload -->
    <button class="tb-btn" id="btn-reload" title="Reload (⌘R)" aria-label="Reload (⌘R)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
      </svg>
    </button>

    <!-- Close -->
    <button class="tb-btn close-btn" id="btn-close" title="Close" aria-label="Close">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <iframe id="app-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"></iframe>

  <script>
    const api = window.miniappShellAPI;

    // ── Populate from params passed via query string ────────
    const params = new URLSearchParams(window.location.search);
    const appUrl  = params.get('url');
    const appName = params.get('name') || 'App';
    let isPinned = params.get('alwaysOnTop') === 'true';

    document.title = appName;
    document.getElementById('app-title').textContent = appName;

    const frame = document.getElementById('app-frame');
    if (appUrl) frame.src = appUrl;

    // ── Always on top (Pin) ──────────────────────────────────
    const pinBtn = document.getElementById('btn-pin');

    function updatePinUI(pinned) {
      if (pinned) {
        pinBtn.classList.add('pinned');
        pinBtn.title = 'Unpin always on top';
        pinBtn.setAttribute('aria-label', 'Unpin always on top');
      } else {
        pinBtn.classList.remove('pinned');
        pinBtn.title = 'Pin always on top';
        pinBtn.setAttribute('aria-label', 'Pin always on top');
      }
    }
    updatePinUI(isPinned);

    async function toggleAlwaysOnTop() {
      if (api && api.toggleAlwaysOnTop) {
        try {
          isPinned = await api.toggleAlwaysOnTop();
          updatePinUI(isPinned);
        } catch (e) {
          console.error("Failed to toggle always on top:", e);
        }
      }
    }

    pinBtn.addEventListener('click', toggleAlwaysOnTop);

    // ── Reload ──────────────────────────────────────────────
    const isMac = /Mac|iPod|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
    const reloadBtn = document.getElementById('btn-reload');
    if (reloadBtn) {
      reloadBtn.title = `Reload (${isMac ? '⌘R' : 'Ctrl+R'})`;
      reloadBtn.setAttribute('aria-label', `Reload (${isMac ? '⌘R' : 'Ctrl+R'})`);
    }

    function reloadApp() {
      // Reset iframe src to force a clean reload
      const src = frame.src;
      frame.src = '';
      requestAnimationFrame(() => { frame.src = src; });
    }

    reloadBtn.addEventListener('click', reloadApp);

    // Keyboard shortcut Cmd/Ctrl + R
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'r') {
        e.preventDefault();
        reloadApp();
      }
    });

    // ── Close ───────────────────────────────────────────────
    document.getElementById('btn-close').addEventListener('click', () => {
      if (api && api.close) api.close();
    });
  </script>
</body>
</html>
