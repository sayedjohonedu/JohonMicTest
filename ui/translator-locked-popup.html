<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Translator Locked</title>
  <link rel="stylesheet" href="popup-theme.css">
</head>
<body>
  <div class="popup-card">
    <div class="ambient-glow ambient-amber"></div>
    
    <button class="top-close-btn" id="top-close" title="Close (Esc)" aria-label="Close">
      <span id="close-icon"></span>
    </button>

    <div class="popup-header">
      <div class="icon-ring icon-ring-amber" id="main-icon"></div>
      <h2 class="popup-title">Translator Locked</h2>
      <div class="badge-pill badge-amber">Premium Feature</div>
    </div>

    <p class="popup-desc">The AI Translator is a <strong>premium feature</strong>. Upgrade your license to access real-time multi-language translation.</p>

    <div class="feature-box">
      <div class="feature-row">
        <span class="feat-icon feat-check"></span> Real-time AI voice translation
      </div>
      <div class="feature-row">
        <span class="feat-icon feat-check"></span> 100+ global languages unlocked
      </div>
      <div class="feature-row">
        <span class="feat-icon feat-check"></span> Seamless system audio injection
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-close">Close</button>
      <button class="btn btn-primary-amber" id="btn-license">Get License Key <span class="kbd">↵</span></button>
    </div>
  </div>

  <script src="icons.js"></script>
  <script>
    MicTabIcons.inject('#close-icon', 'close', { size: 14 });
    MicTabIcons.inject('#main-icon', 'translate', { size: 24 });
    document.querySelectorAll('.feat-check').forEach(el => {
      el.innerHTML = MicTabIcons.render('check', { size: 13, color: '#fbbf24' });
    });

    const openLicense = () => {
      window.junoAPI.openUrl('https://johonsayed.gumroad.com/l/JunoverseAI-Dictation');
    };
    const closePopup = () => {
      window.junoAPI.closeTranslatorLockedPopup();
    };

    document.getElementById('btn-license').addEventListener('click', openLicense);
    document.getElementById('btn-close').addEventListener('click', closePopup);
    document.getElementById('top-close').addEventListener('click', closePopup);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePopup();
      if (e.key === 'Enter') openLicense();
    });
  </script>
</body>
</html>
