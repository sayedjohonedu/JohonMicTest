<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>License Activated!</title>
  <link rel="stylesheet" href="popup-theme.css">
  <style>
    .countdown-ring {
      position: relative;
      z-index: 1;
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }
    .countdown-ring svg { transform: rotate(-90deg); }
    .countdown-ring .ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 4;
    }
    .countdown-ring .ring-progress {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 201;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }
    .countdown-number {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      font-family: var(--pop-font);
    }

    #phase-countdown {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: opacity 0.35s ease;
    }
    #phase-success {
      display: none;
      opacity: 0;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: opacity 0.4s ease;
    }

    .success-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #10b981;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
      animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes scaleIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    #confetti {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="popup-card" style="justify-content: center; gap: 14px;">
    <div class="ambient-glow ambient-emerald"></div>
    <canvas id="confetti"></canvas>

    <!-- Phase 1: Countdown -->
    <div id="phase-countdown">
      <div class="countdown-ring">
        <svg width="72" height="72" viewBox="0 0 72 72">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f59e0b"/>
              <stop offset="100%" stop-color="#10b981"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="36" cy="36" r="32"/>
          <circle class="ring-progress" id="ring" cx="36" cy="36" r="32"/>
        </svg>
        <div class="countdown-number" id="countdown-num">3</div>
      </div>
      <h2 class="popup-title">Activating License</h2>
      <div class="badge-pill badge-amber">Unlocking Pro Features</div>
      <p class="popup-desc">Setting up your unlimited access…</p>
    </div>

    <!-- Phase 2: Success -->
    <div id="phase-success">
      <div class="success-icon" id="success-icon"></div>
      <h2 class="popup-title" style="color: #34d399;">Pro Unlocked!</h2>
      <div class="badge-pill badge-emerald">Unlimited Access Activated</div>
      <p class="popup-desc">Thank you for supporting MicTab!</p>
    </div>
  </div>

  <script src="icons.js"></script>
  <script>
    MicTabIcons.inject('#success-icon', 'check', { size: 30, strokeWidth: 2.5 });

    const TOTAL_SECONDS = 3;
    const circumference = 2 * Math.PI * 32; // r=32
    const ring = document.getElementById('ring');
    const numEl = document.getElementById('countdown-num');
    const phaseCountdown = document.getElementById('phase-countdown');
    const phaseSuccess = document.getElementById('phase-success');
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();

    let remaining = TOTAL_SECONDS;

    function updateRing(frac) {
      ring.style.strokeDashoffset = circumference * frac;
    }
    ring.style.strokeDasharray = circumference;
    updateRing(0);

    const startTime = Date.now();
    const totalMs = TOTAL_SECONDS * 1000;

    function animateCountdown() {
      const elapsed = Date.now() - startTime;
      const frac = Math.min(elapsed / totalMs, 1);
      updateRing(frac);

      const secsLeft = Math.ceil(TOTAL_SECONDS - (elapsed / 1000));
      if (secsLeft !== remaining && secsLeft >= 0) {
        remaining = secsLeft;
        numEl.textContent = secsLeft || '';
      }

      if (frac < 1) {
        requestAnimationFrame(animateCountdown);
      } else {
        showSuccess();
      }
    }
    requestAnimationFrame(animateCountdown);

    function showSuccess() {
      phaseCountdown.style.opacity = '0';
      setTimeout(() => {
        phaseCountdown.style.display = 'none';
        phaseSuccess.style.display = 'flex';
        requestAnimationFrame(() => phaseSuccess.style.opacity = '1');
        launchConfetti();

        // Auto-close after 2.4 seconds
        setTimeout(() => {
          if (window.junoAPI && window.junoAPI.closeLicenseCelebration) {
            window.junoAPI.closeLicenseCelebration();
          }
        }, 2400);
      }, 350);
    }

    // ── Confetti ────────────────────────────
    const confettiPieces = [];
    const COLORS = ['#f59e0b', '#10b981', '#38bdf8', '#fbbf24', '#34d399', '#ffffff'];

    function createConfettiPiece() {
      return {
        x: canvas.width * Math.random(),
        y: -10 - Math.random() * 20,
        w: 4 + Math.random() * 4,
        h: 6 + Math.random() * 6,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        vx: (Math.random() - 0.5) * 2.5,
        vy: 1.5 + Math.random() * 2.5,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.12,
        opacity: 1,
        decay: 0.004 + Math.random() * 0.005,
      };
    }

    function launchConfetti() {
      for (let i = 0; i < 50; i++) confettiPieces.push(createConfettiPiece());
      setTimeout(() => {
        for (let i = 0; i < 25; i++) confettiPieces.push(createConfettiPiece());
      }, 300);
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = confettiPieces.length - 1; i >= 0; i--) {
        const p = confettiPieces[i];
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.rotSpeed;
        p.vy += 0.035;
        p.opacity -= p.decay;

        if (p.opacity <= 0 || p.y > canvas.height + 20) {
          confettiPieces.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0, p.opacity);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (confettiPieces.length > 0) {
        requestAnimationFrame(animateConfetti);
      }
    }
  </script>
</body>
</html>
