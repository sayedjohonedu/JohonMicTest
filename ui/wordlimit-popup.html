<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Daily Limit Reached</title>
  <link rel="stylesheet" href="popup-theme.css">
  <style>
    .progress-wrap {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }
    .words-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
      margin-top: -4px;
    }
  </style>
</head>
<body>
  <div class="popup-card">
    <div class="ambient-glow ambient-amber"></div>
    
    <button class="top-close-btn" id="btn-close-top" title="Close (Esc)" aria-label="Close">
      <span id="close-icon"></span>
    </button>

    <div class="popup-header">
      <div class="icon-ring icon-ring-amber" id="main-icon"></div>
      <h2 class="popup-title">Daily Limit Reached</h2>
    </div>

    <div style="width:100%; display:flex; flex-direction:column; gap:8px; align-items:center;">
      <div class="progress-wrap"><div class="progress-bar"></div></div>
      <div class="words-label" id="words-label">2,000 / 2,000 free words used today</div>
    </div>

    <p class="popup-desc">Your free daily words have been reached. Resets automatically at midnight, or upgrade for unlimited dictation.</p>

    <div class="badge-pill badge-amber" id="reset-timer">Resets in —</div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-settings">Settings</button>
      <button class="btn btn-primary-amber" id="btn-renew">Get License <span class="kbd">↵</span></button>
    </div>
  </div>

  <script src="icons.js"></script>
  <script>
    MicTabIcons.inject('#close-icon', 'close', { size: 14 });
    MicTabIcons.inject('#main-icon', 'clock', { size: 24 });

    async function loadUsage() {
      try {
        if (window.junoAPI && window.junoAPI.getLicenseInfo) {
          const info = await window.junoAPI.getLicenseInfo();
          const used = (info && info.freeDailyWords) ? info.freeDailyWords : 2000;
          const limit = (info && info.freeDailyLimit) ? info.freeDailyLimit : 2000;
          const label = document.getElementById('words-label');
          if (label) {
            label.textContent = `${used.toLocaleString()} / ${limit.toLocaleString()} free words used today`;
          }
        }
      } catch (_) {}
    }
    loadUsage();

    function updateTimer() {
      const now = new Date();
      const midnight = new Date();
      midnight.setHours(24, 0, 0, 0);
      const diffMs = midnight - now;
      const h = Math.floor(diffMs / 3600000);
      const m = Math.floor((diffMs % 3600000) / 60000);
      const s = Math.floor((diffMs % 60000) / 1000);
      document.getElementById('reset-timer').textContent =
        `Resets in ${h}h ${m}m ${s}s`;
    }
    updateTimer();
    setInterval(updateTimer, 1000);

    const openLicense = () => {
      window.junoAPI.openUrl('https://johonsayed.gumroad.com/l/JunoverseAI-Dictation');
    };
    const openSettings = () => {
      window.junoAPI.openSettings();
      window.junoAPI.closeWordLimitPopup();
    };
    const closePopup = () => {
      window.junoAPI.closeWordLimitPopup();
    };

    document.getElementById('btn-renew').addEventListener('click', openLicense);
    document.getElementById('btn-settings').addEventListener('click', openSettings);
    document.getElementById('btn-close-top').addEventListener('click', closePopup);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePopup();
      if (e.key === 'Enter') openLicense();
    });
  </script>
</body>
</html>
