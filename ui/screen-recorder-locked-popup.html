<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Screen Recorder Locked</title>
  <link rel="stylesheet" href="popup-theme.css">
</head>
<body>
  <div class="popup-card">
    <div class="ambient-glow ambient-coral"></div>
    
    <button class="top-close-btn" id="top-close" title="Close (Esc)" aria-label="Close">
      <span id="close-icon"></span>
    </button>

    <div class="popup-header">
      <div class="icon-ring icon-ring-coral" id="main-icon"></div>
      <h2 class="popup-title">Screen Recorder Locked</h2>
      <div class="badge-pill badge-coral">15-day free trial ended</div>
    </div>

    <p class="popup-desc">Your free trial has ended. Activate a license key to continue using the <strong>Screen Recorder</strong> with full features.</p>

    <div class="feature-box">
      <div class="feature-row">
        <span class="feat-icon feat-check"></span> Fullscreen &amp; region recording
      </div>
      <div class="feature-row">
        <span class="feat-icon feat-check"></span> Camera overlay &amp; custom cursor
      </div>
      <div class="feature-row">
        <span class="feat-icon feat-check"></span> Media gallery &amp; video editor
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-close">Close</button>
      <button class="btn btn-primary-coral" id="btn-license">Get License Key <span class="kbd">↵</span></button>
    </div>
  </div>

  <script src="icons.js"></script>
  <script>
    MicTabIcons.inject('#close-icon', 'close', { size: 14 });
    MicTabIcons.inject('#main-icon', 'camera', { size: 24 });
    document.querySelectorAll('.feat-check').forEach(el => {
      el.innerHTML = MicTabIcons.render('check', { size: 13, color: '#fb7185' });
    });

    const openLicense = () => {
      window.junoAPI.openUrl('https://johonsayed.gumroad.com/l/JunoverseAI-Dictation');
    };
    const closePopup = () => {
      window.junoAPI.closeScreenRecorderLockedPopup();
    };

    document.getElementById('btn-license').addEventListener('click', openLicense);
    document.getElementById('btn-close').addEventListener('click', closePopup);
    document.getElementById('top-close').addEventListener('click', closePopup);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePopup();
      if (e.key === 'Enter') openLicense();
    });
  </script>
</body>
</html>
