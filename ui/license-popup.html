<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>License Expired</title>
  <link rel="stylesheet" href="popup-theme.css">
</head>
<body>
  <div class="popup-card">
    <div class="ambient-glow ambient-coral"></div>
    
    <button class="top-close-btn" id="top-close" title="Close (Esc)" aria-label="Close">
      <span id="close-icon"></span>
    </button>

    <div class="popup-header">
      <div class="icon-ring icon-ring-coral" id="main-icon"></div>
      <h2 class="popup-title">License Expired</h2>
    </div>

    <p class="popup-desc">Your last license has expired or was revoked. Please register a new license to restore unlimited access to all features.</p>

    <div class="badge-pill badge-neutral" id="since-badge" style="display:none;">
      <span id="cal-icon" style="display:inline-flex;align-items:center;"></span>
      <span>Previously active since <strong id="since-date" style="color:#fff;">—</strong></span>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-settings">Settings</button>
      <button class="btn btn-primary-amber" id="btn-renew">New License <span class="kbd">↵</span></button>
    </div>
  </div>

  <script src="icons.js"></script>
  <script>
    MicTabIcons.inject('#close-icon', 'close', { size: 14 });
    MicTabIcons.inject('#main-icon', 'alert-triangle', { size: 24 });
    MicTabIcons.inject('#cal-icon', 'calendar', { size: 12, color: 'rgba(255,255,255,0.6)' });

    // Load license info to show activation date
    window.junoAPI.getLicenseInfo().then(info => {
      if (info && info.licenseActivatedDate) {
        const d = new Date(info.licenseActivatedDate);
        document.getElementById('since-date').textContent = d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        document.getElementById('since-badge').style.display = 'inline-flex';
      }
    }).catch(() => {});

    const openRenew = () => {
      window.junoAPI.openUrl('https://johonsayed.gumroad.com/l/JunoverseAI-Dictation');
    };
    const openSettings = () => {
      window.junoAPI.openSettings();
      window.junoAPI.closeLicensePopup();
    };
    const closePopup = () => {
      window.junoAPI.closeLicensePopup();
    };

    document.getElementById('btn-renew').addEventListener('click', openRenew);
    document.getElementById('btn-settings').addEventListener('click', openSettings);
    document.getElementById('top-close').addEventListener('click', closePopup);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePopup();
      if (e.key === 'Enter') openRenew();
    });
  </script>
</body>
</html>
